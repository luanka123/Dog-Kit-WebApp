<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Licenze - Milo Everwood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-800 rounded-[2.5rem] p-8 shadow-2xl border border-slate-700">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3m-3-3l-2.25-2.25"/></svg>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">Generatore Licenze</h1>
            <p class="text-slate-400 text-sm mt-2">Strumento riservato per Milo Everwood Kit</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Nome e Cognome Cliente</label>
                <input type="text" id="name" placeholder="Es: Mario Rossi" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none focus:border-indigo-500 transition-all font-bold">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Data di Nascita</label>
                <input type="date" id="birthDate" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none focus:border-indigo-500 transition-all font-bold">
            </div>

            <button onclick="generate()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl transition-all shadow-lg shadow-indigo-500/20 active:scale-[0.98]">
                Genera Codice Licenza
            </button>

            <div id="resultContainer" class="hidden mt-8 pt-6 border-t border-slate-700 text-center">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Codice da inviare al cliente:</p>
                <div class="flex items-center gap-2">
                    <div id="result" class="flex-1 p-4 bg-indigo-950 text-indigo-400 border border-indigo-900 rounded-2xl font-mono text-2xl font-bold tracking-[0.2em]">
                        --------
                    </div>
                    <button onclick="copyCode()" class="p-4 bg-slate-700 hover:bg-slate-600 rounded-2xl transition-colors" title="Copia">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                </div>
                <p class="text-[10px] text-slate-500 mt-4 italic">Assicurati che il cliente inserisca il nome esattamente come lo hai scritto qui.</p>
            </div>
        </div>
    </div>

    <script>
        function generate() {
            const name = document.getElementById('name').value;
            const birthDate = document.getElementById('birthDate').value;
            
            if (!name || !birthDate) {
                alert('Inserisci nome e data di nascita!');
                return;
            }

            const cleanName = name.toLowerCase().trim().replace(/\s/g, '');
            const cleanBirth = birthDate.replace(/-/g, '');
            const combined = cleanName + cleanBirth + "MILO_SECRET_2024";
            
            // DJB2 Hash (stesso dell'app)
            let hash = 5381;
            for (let i = 0; i < combined.length; i++) {
                hash = ((hash << 5) + hash) + combined.charCodeAt(i);
            }
            
            const code = Math.abs(hash).toString(16).toUpperCase().slice(0, 8);
            
            document.getElementById('result').innerText = code;
            document.getElementById('resultContainer').classList.remove('hidden');
        }

        function copyCode() {
            const code = document.getElementById('result').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert('Codice copiato negli appunti!');
            });
        }
    </script>
</body>
</html>
